<body>
  <div id="game">
    <canvas id="c"></canvas>
    <div id="warn"></div>
    <div id="splat"></div>
    <div id="feed"></div>
    <div id="pops"></div>
    <div id="banner" class="hidden"></div>
    <div id="ghost" class="hidden">👻 你已陣亡，觀戰中 <button id="bFfwd">快轉</button></div>
  </div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bNear"><span>近</span><i></i></button>
      <button id="bFar"><span>遠</span><i></i></button>
      <button id="bArea"><span>範圍</span><i></i></button>
      <button id="bItem"><span>道具</span></button>
      <button id="bRoll">翻滾<i></i></button>
      <button id="bSlash">砍！</button>
    </div>
  </div>

  <div id="select" class="screen">
    <h1>打人三項</h1>
    <div class="sub shadow">大逃殺：被死亡之牆追著打，殺到只剩你一個</div>
    <div id="cards"></div>
    <div class="keys">
      <span class="kb"><b>WASD</b> 移動（前後是相對殺戮帶）　<b>J</b> 揮砍（按住連砍）　<b>K</b> 近距離　<b>L</b> 遠距離　<b>I</b> 範圍<br>
      <b>空白鍵</b> 道具（可存兩個）　<b>Shift</b> 翻滾閃避（短暫無敵）<br></span>
      <span class="tc">左邊搖桿移動・右邊三招＋道具＋翻滾＋砍<br></span>
      後面的死亡之牆會吃掉落後的人，前面的電網會把人彈回來<br>
      游泳 30→20・單車 20→10・跑步 10→5・血池決戰 剩 1 人
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div id="resRank"></div>
    <div id="resBody" class="panel"></div>
    <button class="btn" onclick="location.reload()">再殺一場</button>
  </div>

</body>
</html>
