<body>
  <div id="game">
    <canvas id="c"></canvas>
    <div id="warn"></div>
    <div id="splat"></div>
    <div id="feed"></div>
    <div id="pops"></div>
    <div id="banner" class="hidden"></div>
    <div id="hint" class="hidden"></div>
    
  </div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bNear"><span>近</span><i></i></button>
      <button id="bFar"><span>遠</span><i></i></button>
      <button id="bArea"><span>範圍</span><i></i></button>
      <button id="bJump">跳</button>
      <button id="bDodge">閃避<i></i></button>
      <button id="bAtk">攻擊！</button>
    </div>
  </div>

  <div id="select" class="screen">
    <img id="logo" class="hidden" alt="打人三項" /><h1 id="title">打人三項</h1>
    <div class="sub shadow">6 人混戰：打倒所有人，活到最後的就是冠軍</div>
    <div id="cards"></div>
    <div class="keys">
      <span class="kb"><b>WASD</b> 移動　<b>J</b> 攻擊（連按三連擊、按住連打）　<b>K</b> 跳（空中按 J 飛踢）　<b>L</b> 閃避<br>
      <b>U</b> 近距離招　<b>I</b> 遠距離招　<b>O</b> 範圍招　走過道具會自動撿起來<br></span>
      <span class="tc">左邊搖桿移動・右邊攻擊／跳／閃避＋三招<br>走過道具會自動撿起來<br></span>
      🌊 海嘯來時快往沙灘上跑　🦈 淺水區有鯊魚
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div id="resRank"></div>
    <div id="resBody" class="panel"></div>
    <button class="btn" onclick="location.reload()">再殺一場</button>
  </div>

</body>
</html>
