<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c0612" />
  <title>打人三項</title>
  <style>
    html, body { margin: 0; width: 100vw; height: 100vh; background: #0c0612; overflow: hidden; overscroll-behavior: none; }
    body { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; color: #fff; user-select: none; -webkit-user-select: none;
      touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body.landscape { display: flex; align-items: center; justify-content: center; }
    body.portrait { display: flex; flex-direction: column; align-items: center; }
    #game { position: relative; overflow: hidden; flex: none; }
    #c { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    .hidden { display: none !important; }
    .shadow { text-shadow: 3px 3px 0 #1a1028, -2px -2px 0 #1a1028, 2px -2px 0 #1a1028, -2px 2px 0 #1a1028; }

    #splat, #warn { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    #warn { box-shadow: inset 0 0 60px 20px rgba(255,0,20,.9); }
    #pops { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); pointer-events: none; text-align: center; }
    .pop { font-size: clamp(20px, 6.5vw, 36px); font-weight: 900; white-space: nowrap; animation: pop 1.1s ease-out forwards;
      text-shadow: 3px 3px 0 #1a1028, -2px -2px 0 #1a1028, 2px -2px 0 #1a1028, -2px 2px 0 #1a1028; }
    .pop.kill { color: #ff3040; font-size: clamp(26px, 8.5vw, 46px); }
    .pop.skill { color: #ffd000; }
    .pop.bad { color: #ff6070; }
    @keyframes pop { 0% { transform: scale(1.6); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
    #banner { position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; animation: ban 2.4s ease-out forwards;
      background: linear-gradient(90deg, transparent, rgba(120,0,16,.85) 20%, rgba(120,0,16,.85) 80%, transparent); padding: 6px 0; }
    #banner .t { font-size: clamp(22px, 7vw, 40px); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #1a1028; }
    #banner .s { font-size: clamp(13px, 4vw, 18px); color: #ffd0d8; font-weight: bold; }
    @keyframes ban { 0% { transform: scaleY(0); } 10% { transform: scaleY(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
    #feed { position: absolute; left: 8px; top: 30%; font-size: 12px; line-height: 1.6; pointer-events: none; text-shadow: 2px 2px 0 #1a1028, -1px -1px 0 #1a1028; }
    #feed .mine { color: #ffe000; font-weight: bold; }
    #ghost { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); background: rgba(40,60,90,.85); border: 2px solid #c8e0ff;
      padding: 4px 12px; font-size: 13px; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
    #bFfwd { font-family: inherit; font-weight: 900; color: #fff; background: #3a5a8a; border: 2px solid #fff; padding: 2px 10px; }

    /* 觸控：左邊搖桿、右邊六顆按鈕 */
    #touch { display: flex; gap: 10px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); box-sizing: border-box; }
    body.portrait #touch { width: 100vw; height: 220px; flex: none; background: #160a20; border-top: 3px solid #2a1840; }
    body.landscape #touch { position: fixed; left: 0; right: 0; bottom: 0; height: 160px; pointer-events: none; }
    body.landscape #touch > * { pointer-events: auto; opacity: .8; }
    #stick { flex: 0.85; position: relative; background: #2a1840; border: 3px solid #f0e0ff; box-shadow: 0 0 0 3px #1a1028; border-radius: 50%;
      aspect-ratio: 1; align-self: center; max-height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
    body.landscape #stick { flex: none; width: 140px; }
    #knob { width: 40%; height: 40%; background: #ffd000; border: 3px solid #fff; box-shadow: 0 0 0 3px #1a1028; border-radius: 50%; pointer-events: none; }
    #btns { flex: 1.3; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 8px; }
    body.landscape #btns { flex: none; width: 44%; margin-left: auto; }
    #btns button { position: relative; font-family: inherit; color: #fff; font-weight: 900; font-size: 12px; border: 3px solid #fff; box-shadow: 0 0 0 3px #1a1028;
      background: #4a3070 no-repeat center 30%; background-size: 44%; image-rendering: pixelated;
      display: flex; align-items: flex-end; justify-content: center; padding: 0 2px 4px; touch-action: none; line-height: 1.1; }
    #btns button i { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 26px;
      text-shadow: 2px 2px 0 #1a1028; pointer-events: none; }
    #btns button.cool { filter: grayscale(.8) brightness(.6); }
    #btns button.on { transform: translateY(2px); filter: brightness(1.4); }
    #bSlash { background-color: #d01828 !important; font-size: 26px !important; align-items: center !important; }
    #bRoll { background-color: #2a6a4a !important; }
    #bItem.ready { background-color: #b07000; animation: glow 1s infinite; }
    #bNear, #bFar, #bArea { background-color: #1a5a90; }
    @keyframes glow { 50% { box-shadow: 0 0 0 3px #1a1028, 0 0 14px #ffd000; } }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20,8,30,.6); padding: 12px; overflow-y: auto; box-sizing: border-box; touch-action: pan-y; }
    h1 { margin: 0 0 4px; font-size: clamp(36px, 10vw, 52px); color: #ff2a3a; letter-spacing: 6px; text-shadow: 4px 4px 0 #1a1028, 0 0 24px #f00; }
    .sub { margin-bottom: 14px; font-size: 16px; color: #ffd0d8; text-align: center; }
    #cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .card { position: relative; width: 200px; background: #2a1840; border: 3px solid #f0e0ff; box-shadow: 0 0 0 3px #1a1028, 6px 6px 0 #1a1028;
      color: #fff; font-family: inherit; padding: 10px; cursor: pointer; text-align: left; }
    .card:hover { background: #4a2a70; }
    .card .num { position: absolute; right: 8px; top: 6px; color: #ffd000; font-weight: 900; font-size: 20px; }
    .portrait { width: 100px; height: 100px; image-rendering: pixelated; display: block; margin: 0 auto 6px; background: #3a2458; }
    .card .nm { font-size: 20px; font-weight: 900; text-align: center; }
    .card .sk { color: #ffe8a0; margin: 6px 0 2px; font-size: 12px; line-height: 1.6; }
    .card .sk b { color: #1a1028; background: #ffd000; padding: 0 3px; margin-right: 2px; font-size: 11px; }
    .card .ds { font-size: 12px; color: #d8c8f0; }
    body.portrait .card { width: calc(50vw - 24px); padding: 8px; }
    body.portrait .portrait { width: 64px; height: 64px; }
    body.portrait .card .num, body.portrait .card .ds { display: none; }
    .keys { margin-top: 14px; font-size: 13px; color: #e8d8ff; line-height: 1.8; text-align: center; background: rgba(26,16,40,.85); padding: 6px 14px; border: 2px solid #f0e0ff; max-width: 700px; }
    .keys b { color: #ffd000; }
    body.touch .keys .kb { display: none; }
    body:not(.touch) .keys .tc { display: none; }
    .panel { background: #2a1840; border: 3px solid #f0e0ff; box-shadow: 0 0 0 3px #1a1028; padding: 14px 24px; min-width: 240px; margin: 12px 0; }
    .panel .row { display: flex; justify-content: space-between; gap: 20px; font-size: 18px; padding: 3px 0; }
    #resRank { font-size: clamp(28px, 8vw, 44px); font-weight: 900; text-align: center; }
    #resRank.win { color: #ffd000; } #resRank.lose { color: #ff4050; }
    .btn { font-family: inherit; font-size: 22px; font-weight: 900; color: #fff; background: #e02030; border: 3px solid #fff;
      box-shadow: 0 0 0 3px #1a1028, 4px 4px 0 #1a1028; padding: 8px 30px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="c"></canvas>
    <div id="warn"></div>
    <div id="splat"></div>
    <div id="feed"></div>
    <div id="pops"></div>
    <div id="banner" class="hidden"></div>
    <div id="ghost" class="hidden">👻 你已陣亡，觀戰中 <button id="bFfwd">快轉</button></div>
  </div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bNear"><span>近</span><i></i></button>
      <button id="bFar"><span>遠</span><i></i></button>
      <button id="bArea"><span>範圍</span><i></i></button>
      <button id="bItem"><span>道具</span></button>
      <button id="bRoll">翻滾<i></i></button>
      <button id="bSlash">砍！</button>
    </div>
  </div>

  <div id="select" class="screen">
    <h1>打人三項</h1>
    <div class="sub shadow">大逃殺：被死亡之牆追著打，殺到只剩你一個</div>
    <div id="cards"></div>
    <div class="keys">
      <span class="kb"><b>WASD</b> 移動（前後是相對殺戮帶）　<b>J</b> 揮砍（按住連砍）　<b>K</b> 近距離　<b>L</b> 遠距離　<b>I</b> 範圍<br>
      <b>空白鍵</b> 道具（可存兩個）　<b>Shift</b> 翻滾閃避（短暫無敵）<br></span>
      <span class="tc">左邊搖桿移動・右邊三招＋道具＋翻滾＋砍<br></span>
      後面的死亡之牆會吃掉落後的人，前面的電網會把人彈回來<br>
      游泳 30→20・單車 20→10・跑步 10→5・血池決戰 剩 1 人
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div id="resRank"></div>
    <div id="resBody" class="panel"></div>
    <button class="btn" onclick="location.reload()">再殺一場</button>
  </div>

  <script type="module" src="/br/main.js"></script>
</body>
</html>
